services:
  postgres:
    image: postgres:18
    container_name: vmestra-postgres-dev
    environment:
      POSTGRES_DB: vmestra
      POSTGRES_USER: vmestra
      POSTGRES_PASSWORD: vmestra_dev_password
    ports:
      - "55432:5432"
    volumes:
      - vmestra-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vmestra -d vmestra"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  vmestra-postgres-data:
